<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">

        <section class="left">
            <header class="bar">
                <h1>INSECT</h1>
                <div class="search-bar">
                                
                    <img src="https://task-projects-eati.vercel.app/images/search-icon.png" alt="search">
                    <input type="text" placeholder="search here...">
                 </div>
            </header>



        
        
            <div class="classification">
            <h1>CLASSIFICATION</h1>
            </div>
        


       <div class="details">

                <div class="detail">
                    <h3>Class</h3>
                    <p>Insecta</p>
                    <div class="line"></div>
                </div>

                <div class="detail">
                    <h3>Order</h3>
                    <p>Coleoptera</p>
                    <div class="line"></div>
                </div>

                <div class="detail">
                    <h3>Family</h3>
                    <p>Cerambycinae</p>
                    <div class="line"></div>
                </div>

                <div class="detail">
                    <h3>SubFamily</h3>
                    <p>Cerambycinae</p>
                    <div class="line"></div>
                </div>

                <div class="detail">
                    <h3>Tribe</h3>
                    <p>Callicromatini</p>
                    <div class="line"></div>
                </div>

                <div class="detail">
                    <h3>Genus</h3>
                    <p>Pachyteria</p>
                    <div class="line"></div>
                </div>

            </div>

            </section>

            <img class="insect-img" src="https://task-projects-eati.vercel.app/images/jar_crop-removebg-preview%20(1).png" alt="insect">
             
            <section class="right">

                <nav>
                    <a href="#">Home</a>
                    <a href="#">Shop</a>
                    <a href="#">About</a>
                    <a href="#">Gallery</a>
                    <a href="#">Contact</a>
                </nav>


                <h1 >Pachyteria equestris</h1>


                <div class="small">
                    <img src="https://task-projects-eati.vercel.app/images/outline.png" alt="shadow of mosquito">
                    <h2>32 mm</h2></div>
                


                    <div class="straightline"></div>
                    

                    <div class="images">
                    <div class="info">
                        <div class="map">
                            <img src="https://task-projects-eati.vercel.app/images/map-pin-line.png" alt="map">
                        <h3> Locality: <br> Malaysia</h3>

                        </div>

                        <div class="info">
                            <img src="https://task-projects-eati.vercel.app/images/men-line.png" alt="sex">
                            <h3>Sex: <br>Male</h3>
                        </div>
                        <div class="info">
                            <img src="https://task-projects-eati.vercel.app/images/ruler-line%20(1).png" alt="size">
                            <h3>Size: <br>32 mm <br>/12 mm</h3>
                        </div>
                    </div>


                    <h2 class="price">$5.99</h2>

                    <div class="options">

                <label>
                    <input type="checkbox">
                    <span class="switch"></span>
                    View detailed antennae
                </label>

                <label>
                    <input type="checkbox">
                    <span class="switch"></span>
                    View underside
                </label>

            </div>

                    <button>Add to collection</button>







             </section>
        </main>
</body>
</html>
